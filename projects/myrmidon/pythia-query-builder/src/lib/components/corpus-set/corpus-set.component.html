<div>
  <!-- corpus picker -->
  <div class="form-row">
    <cadmus-refs-lookup
      [service]="corpusLookupService"
      [baseFilter]="{ userId: userId() }"
      label="corpus"
      (itemChange)="onCorpusChange($event)"
    />
    <button
      type="button"
      mat-icon-button
      class="mat-warn"
      (click)="clear()"
      i18n-matTooltip
      matTooltip="Remove all corpora"
      i18n-aria-label
      aria-label="Remove all corpora"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
  </div>

  <!-- corpora list -->
  <table>
    <thead>
      <tr>
        <th><span class="cdk-visually-hidden" i18n>actions</span></th>
        <th>ID</th>
        <th i18n>title</th>
      </tr>
    </thead>
    <tbody>
      @for (c of corpora(); track c; let i = $index) {
        <tr>
          <td>
            <button
              type="button"
              class="mat-warn"
              mat-icon-button
              (click)="deleteCorpus(i)"
              i18n-matTooltip
              matTooltip="Remove this corpus"
              i18n-aria-label
              aria-label="Remove corpus"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
          <td>{{ c.id }}</td>
          <td>{{ c.title }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
