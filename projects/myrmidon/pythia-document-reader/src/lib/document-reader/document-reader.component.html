@if (document$ | async; as doc) {
  <div id="container">
    <!-- progress -->
    @if (loading$ | async) {
      <div id="progress">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      </div>
    }
    <!-- map -->
    @if (!hideMap()) {
      @if (map$ | async; as map) {
        <div id="map">
          <pythia-map-paged-tree-browser
            [map]="map"
            [debug]="debug()"
            [filterTreshold]="filterTreshold()"
            (mapNodeClick)="onMapNodeClick($event)"
          />
        </div>
      }
    }
    <!-- text -->
    <div id="text">
      <div class="doc-head" role="heading" aria-level="3">
        @if (doc.author) {
          <span>{{ doc.author }} - </span>
        }
        {{ doc.title }}
      </div>
      @if (text$ | async; as text) {
        <!-- focusable, so that keyboard users can scroll it -->
        <div id="body" tabindex="0" [innerHtml]="text"></div>
      }
    </div>
  </div>
}
