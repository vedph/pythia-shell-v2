<div>
  @if (nodes$ && nodes$ | async; as nodes) {
    <div class="form-row">
      <!-- filters -->
      @if (nodes.length > filterTreshold()) {
        <div id="filters">
          <mat-form-field>
            <input
              matInput
              placeholder="filter"
              i18n-placeholder
              aria-label="filter"
              i18n-aria-label
              [formControl]="labelFilter"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              [disabled]="!labelFilter.value"
              (click)="resetLabelFilter()"
              i18n-aria-label
              aria-label="Clear filter"
            >
              <mat-icon class="mat-warn">cancel</mat-icon>
            </button>
          </mat-form-field>
        </div>
        <!-- full document -->
        @if (!hideFullDocument()) {
          <button
            type="button"
            mat-icon-button
            matTooltip="Whole document"
            i18n-matTooltip
            i18n-aria-label
            aria-label="Whole document"
            (click)="showFullDocument()"
          >
            <mat-icon color="primary">article</mat-icon>
          </button>
        }
      }
    </div>

    <!-- list -->
    <div id="list">
      <div>
        @for (node of nodes; track node.id; let i = $index) {
          <div>
            <pdb-browser-tree-node
              class="node"
              [node]="node"
              [debug]="debug()"
              [paging]="
                node.expanded &&
                i + 1 < nodes.length &&
                nodes[i + 1].paging.pageCount > 1
                  ? nodes[i + 1].paging
                  : undefined
              "
              [hideFilter]="true"
              [hideLoc]="false"
              (toggleExpandedRequest)="onToggleExpanded($any($event))"
              (changePageRequest)="onPageChangeRequest($event)"
              (click)="onMapNodeClick(node)"
            >
            </pdb-browser-tree-node>
          </div>
        }
      </div>
    </div>
  }
</div>
