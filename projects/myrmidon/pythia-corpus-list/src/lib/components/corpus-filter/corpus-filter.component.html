<div>
  <!-- id -->
  <div>
    <mat-form-field>
      <mat-label>ID</mat-label>
      <input matInput [formField]="form.id" (keydown.enter)="apply()" />
    </mat-form-field>
  </div>

  <!-- title -->
  <div>
    <mat-form-field>
      <mat-label i18n>title</mat-label>
      <input matInput [formField]="form.title" (keydown.enter)="apply()" />
    </mat-form-field>
  </div>

  <div id="toolbar" class="btn-group" role="group" aria-label="toolbar">
    <button
      mat-icon-button
      type="button"
      (click)="reset()"
      class="mat-warn"
      i18n-matTooltip
      matTooltip="Reset filters"
      i18n-aria-label
      aria-label="Reset filters"
      [disabled]="disabled()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      class="mat-primary"
      [disabled]="disabled()"
      (click)="apply()"
      i18n-matTooltip
      matTooltip="Apply filters"
      i18n-aria-label
      aria-label="Apply filters"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
